<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Best Friend ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fdf2f8; /* Light aesthetic pink */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            color: #333;
        }
        .slide {
            display: none;
            padding: 20px;
            animation: fadeIn 1s ease-in-out;
        }
        .slide.active {
            display: block;
        }
        h1 {
            font-size: 32px;
            color: #db2777; /* Deep pink */
            margin-bottom: 10px;
        }
        p {
            font-size: 20px;
            margin-bottom: 25px;
        }
        .quote {
            font-size: 26px;
            font-style: italic;
            font-weight: bold;
            color: #be185d;
            padding: 20px;
            line-height: 1.5;
        }
        img {
            max-width: 90%;
            max-height: 50vh;
            border: 8px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            background-color: #f43f5e;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        button:hover {
            background-color: #e11d48;
            transform: scale(1.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Slide 1 -->
    <div class="slide active" id="slide1">
        <h1>Hello! 👋</h1>
        <p>I have a small surprise for you...</p>
        <button onclick="nextSlide(1)">Click Here ➡️</button>
    </div>

    <!-- Slide 2 -->
    <div class="slide" id="slide2">
        <h1>You know what? 🤔</h1>
        <p>Life brings a lot of people, but...</p>
        <button onclick="nextSlide(2)">Next ➡️</button>
    </div>

    <!-- Slide 3 -->
    <div class="slide" id="slide3">
        <h1>Only a few stay.</h1>
        <p>And I am so glad you did.</p>
        <button onclick="nextSlide(3)">Next ➡️</button>
    </div>

    <!-- Slide 4 -->
    <div class="slide" id="slide4">
        <div class="quote">
            “Some people become memories, but the best friends become a part of your heart forever.” ❤️
        </div>
        <button onclick="nextSlide(4)">Next ➡️</button>
    </div>

    <!-- Slide 5 (Image Slide) -->
    <div class="slide" id="slide5">
        <h1>Cheers to Us! ✨</h1>
        <!-- You mentioned this image name -->
        <img src="1000273339.jpg" alt="Our Beautiful Memory">
        <br>
        <button onclick="location.reload()">Replay 🔄</button>
    </div>

    <script>
        function nextSlide(current) {
            document.getElementById('slide' + current).classList.remove('active');
            document.getElementById('slide' + (current + 1)).classList.add('active');
        }
    </script>

</body>
</html>
