<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Best Friends ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff0f5, #ffe4ec);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 35px 20px;
        }

        .heart {
            font-size: 55px;
            animation: beat 1.2s infinite;
            margin-bottom: 20px;
        }

        h1 {
            color: #e91e63;
            font-size: 42px;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 19px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .friends {
            font-size: 45px;
            margin-bottom: 30px;
        }

        .next-btn {
            display: inline-block;
            text-decoration: none;
            background: #f43f5e;
            color: white;
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.3);
            transition: 0.3s;
        }

        .next-btn:hover {
            transform: scale(1.08);
            background: #e91e63;
        }

        .small {
            margin-top: 25px;
            color: #888;
            font-size: 14px;
        }

        .floating {
            position: absolute;
            font-size: 25px;
            animation: float 5s linear infinite;
            opacity: 0.7;
        }

        .one {
            left: 10%;
            bottom: -30px;
            animation-delay: 0s;
        }

        .two {
            left: 30%;
            bottom: -30px;
            animation-delay: 1.5s;
        }

        .three {
            left: 70%;
            bottom: -30px;
            animation-delay: 3s;
        }

        .four {
            left: 90%;
            bottom: -30px;
            animation-delay: 4s;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="floating one">❤️</div>
    <div class="floating two">✨</div>
    <div class="floating three">💗</div>
    <div class="floating four">💕</div>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>Hey Besties! 🥹</h1>

        <p class="subtitle">
            I made a little something for you...
            <br>
            So, don't leave yet! 👀
            <br>
            There's a small surprise waiting for you. 💌
        </p>

        <div class="friends">
            🫶🏻✨👭🏻✨🫶🏻
        </div>

        <a href="page2.html" class="next-btn">
            Open the Surprise 💌
        </a>

        <p class="small">
            Click the button and keep going... 👀❤️
        </p>

    </div>

</body>
</html>
